---
layout: default
---
<div class="article-grid">
  <article class="article">
    <header class="article-header">
      {%- if page.section %}
      <div class="tags"><a class="tag" href="{{ '/' | append: page.section | append: '/' | relative_url }}">{{ page.section }}</a></div>
      {%- endif %}
      <h1 class="gradient">{{ page.title }}</h1>
    </header>
    <details class="toc-inline" hidden>
      <summary>contents</summary>
      <nav class="toc" data-toc aria-label="Table of contents"></nav>
    </details>
    <div class="prose" id="prose">
      {{ content }}
    </div>
  </article>
  <aside class="toc-aside" hidden>
    <nav class="toc" data-toc aria-label="Table of contents">
      <p class="toc-title">on this page</p>
    </nav>
  </aside>
</div>
